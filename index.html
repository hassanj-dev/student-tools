<!doctype html>
<html lang="en">
<head>

  <link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
/>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
  <!-- === CORE === -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />

  <!-- === TITLE + SEO === -->
  <title>SparkDesk | Free GPA Calculator, Resume Builder & Student Tools</title>
  <meta name="description"
    content="SparkDesk is the all-in-one student productivity platform. Free GPA calculator, AI resume builder, timetable planner, flashcards, and 10+ tools. Trusted by students worldwide." />
  <meta name="keywords"
    content="GPA calculator, resume builder for students, timetable planner, study flashcards, student productivity tools, free student apps, SparkDesk, academic planner, student organizer" />
  <meta name="author" content="SparkDesk" />
  <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large" />
  <link rel="canonical" href="https://sparkdesk.xyz/" />

  <!-- === FAVICON / ICONS === -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" href="/favicon-32x32.png" sizes="32x32" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="theme-color" content="#4F46E5" />

  <!-- === OPEN GRAPH (Facebook, WhatsApp, LinkedIn) === -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://sparkdesk.xyz/" />
  <meta property="og:title" content="SparkDesk | Free Student Tools — GPA, Resume, Flashcards & More" />
  <meta property="og:description" content="All-in-one free toolkit for students. Calculate GPA, build your resume, plan your timetable, and study smarter with SparkDesk." />
  <meta property="og:image" content="https://sparkdesk.xyz/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:site_name" content="SparkDesk" />
  <meta property="og:locale" content="en_US" />

  <!-- === TWITTER / X CARD === -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@SparkDeskApp" />
  <meta name="twitter:title" content="SparkDesk | Free Student Tools" />
  <meta name="twitter:description" content="GPA calculator, resume builder, timetable planner, flashcards & more — all free for students." />
  <meta name="twitter:image" content="https://sparkdesk.xyz/og-image.png" />

  <!-- === PERFORMANCE === -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="dns-prefetch" href="https://fonts.gstatic.com" />

  <!-- === SCHEMA.ORG STRUCTURED DATA (JSON-LD) === -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "SparkDesk",
    "url": "https://sparkdesk.xyz/",
    "description": "All-in-one student productivity platform with GPA calculator, resume builder, timetable planner, and flashcards.",
    "applicationCategory": "EducationApplication",
    "operatingSystem": "Web",
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
    "featureList": [
      "GPA Calculator", "Resume Builder", "Timetable Planner",
      "Flashcard Study Tool", "Image Converter", "Calculator"
    ],
    "author": {
      "@type": "Organization",
      "name": "SparkDesk",
      "url": "https://sparkdesk.xyz/"
    }
  }
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
